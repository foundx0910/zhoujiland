<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c2410c" />
    <!-- %SITE_NAME% / %SITE_TAGLINE% 会在构建时由 web/src/site.js 自动替换，不用手改 -->
    <title>%SITE_NAME%</title>
    <meta name="description" content="%SITE_TAGLINE%" />
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" style="max-width: 560px; margin: 15vh auto; padding: 0 24px; font: 15px/1.7 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #4b5563; text-align: center">
        正在开门迎客…
      </div>
    </div>

    <!--
      兜底提示：如果 6 秒后 React 还没挂载（脚本被拦、浏览器太旧、网络异常），
      就把这里换成一段人能看懂的说明，避免用户只看到一片空白。
      这段是普通脚本，不依赖 ES Module，所以即使在老浏览器里也会执行。
    -->
    <script>
      (function () {
        setTimeout(function () {
          var el = document.getElementById('boot-fallback');
          if (!el) return; // React 已经挂载并替换掉了它
          el.innerHTML =
            '<div style="font-size:40px;line-height:1;margin-bottom:14px">🛠️</div>' +
            '<p style="font-size:17px;font-weight:600;color:#111827;margin:0 0 10px">页面没能加载出来</p>' +
            '<p style="margin:0 0 6px">可以按顺序试这几步：</p>' +
            '<p style="margin:0 0 4px">1. 强制刷新页面（电脑 ⌘+Shift+R，手机下拉刷新）</p>' +
            '<p style="margin:0 0 4px">2. 换用最新版 Chrome / Edge / Safari 打开</p>' +
            '<p style="margin:0 0 4px">3. 关掉广告拦截类插件，或换一个网络（手机流量）再试</p>' +
            '<p style="margin:14px 0 0;font-size:13px;color:#9ca3af">如果一直这样，把这一屏截图发给站长</p>';
        }, 6000);
      })();
    </script>

    <noscript>
      <div style="max-width: 560px; margin: 15vh auto; padding: 0 24px; font: 15px/1.7 -apple-system, sans-serif; text-align: center">
        这个站需要 JavaScript 才能跑起来，打开之后刷新一下就好。
      </div>
    </noscript>

    <!--
      首页抢跑：HTML 一解析就把板块数据请求发出去，让接口请求和 JS 下载【并行】。
      没有这段的话，必须等 JS 下载+解析完才发起请求，白白多等一秒左右。
      只在首页执行；失败也不影响，前端会自己重新请求。
    -->
    <script>
      (function () {
        if (location.pathname !== '/' && location.pathname !== '/index.html') return;
        try {
          window.__BOARDS__ = fetch('/api/boards', { credentials: 'same-origin' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        } catch (e) {
          /* 忽略 */
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
